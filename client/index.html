<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#f2f0e9" />
    <meta name="description" content="&lt;ismo1lov/&gt; — fullstack developer portfolio sahifasi." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ismo1lov - Portfolio</title>
    <style>
      html,
      body {
        margin: 0;
        background: #101613;
      }

      #welcome-screen {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #101613;
        color: #f2f0e9;
        transform: translateY(0);
        will-change: transform;
      }

      .welcome-mark {
        position: relative;
        display: grid;
        gap: 18px;
        text-align: center;
      }

      .welcome-kicker {
        display: inline-block;
        opacity: 0;
        font: 500 11px/1 "DM Mono", monospace;
        letter-spacing: .3em;
        text-transform: uppercase;
        color: #b8f230;
        animation: kickerIn .55s cubic-bezier(0.23, 1, 0.32, 1) .95s forwards;
      }

      .welcome-word-frame {
        position: relative;
        display: inline-block;
        font: 700 clamp(44px, 8vw, 96px)/.88 "Bricolage Grotesque", sans-serif;
        letter-spacing: -.02em;
      }

      .welcome-word {
        display: inline-block;
        overflow: hidden;
        padding: .02em 0;
      }

      .welcome-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(115%) rotate(4deg);
        animation: charIn .55s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      .welcome-char:nth-child(1) { animation-delay: .9s; }
      .welcome-char:nth-child(2) { animation-delay: .95s; }
      .welcome-char:nth-child(3) { animation-delay: 1s; }
      .welcome-char:nth-child(4) { animation-delay: 1.05s; }
      .welcome-char:nth-child(5) { animation-delay: 1.1s; }
      .welcome-char:nth-child(6) { animation-delay: 1.15s; }
      .welcome-char:nth-child(7) { animation-delay: 1.2s; }
      .welcome-char:nth-child(8) { animation-delay: 1.25s; }

      .welcome-screen.is-reload .welcome-char:nth-child(1) { animation-delay: 1s; }
      .welcome-screen.is-reload .welcome-char:nth-child(2) { animation-delay: 1.05s; }
      .welcome-screen.is-reload .welcome-char:nth-child(3) { animation-delay: 1.1s; }
      .welcome-screen.is-reload .welcome-char:nth-child(4) { animation-delay: 1.15s; }
      .welcome-screen.is-reload .welcome-char:nth-child(5) { animation-delay: 1.2s; }
      .welcome-screen.is-reload .welcome-char:nth-child(6) { animation-delay: 1.25s; }
      .welcome-screen.is-reload .welcome-char:nth-child(7) { animation-delay: 1.3s; }
      .welcome-screen.is-reload .welcome-char:nth-child(8) { animation-delay: 1.35s; }

      .welcome-ring-l,
      .welcome-ring-r {
        position: absolute;
        top: 50%;
        color: #b8f230;
        font-weight: 700;
        line-height: 1;
        will-change: transform;
      }

      .welcome-ring-l {
        left: 50%;
        transform: translate(-50%, -50%) rotate(720deg);
        animation: bracketSpinL 1s linear forwards, ringOutL .8s cubic-bezier(0.23, 1, 0.32, 1) 1.05s forwards;
      }

      .welcome-ring-r {
        right: 50%;
        transform: translate(50%, -50%) rotate(720deg);
        animation: bracketSpinR 1s linear forwards, ringOutR .8s cubic-bezier(0.23, 1, 0.32, 1) 1.05s forwards;
      }

      .welcome-screen.is-reload .welcome-ring-l {
        animation: bracketSpinL 1s linear forwards, ringOutL .7s cubic-bezier(0.23, 1, 0.32, 1) .95s forwards;
      }

      .welcome-screen.is-reload .welcome-ring-r {
        animation: bracketSpinR 1s linear forwards, ringOutR .7s cubic-bezier(0.23, 1, 0.32, 1) .95s forwards;
      }

      .welcome-screen.is-reload .welcome-kicker {
        animation-delay: 1s;
      }

      .welcome-screen.is-reload .welcome-line:after {
        animation-delay: 1.05s;
      }

      .welcome-line {
        width: 160px;
        height: 2px;
        overflow: hidden;
        margin: 0 auto;
        background: rgba(242, 240, 233, .18);
      }

      .welcome-line:after {
        content: '';
        display: block;
        width: 100%;
        height: 100%;
        background: #b8f230;
        transform: translateX(-100%);
        animation: loadLine 1.1s cubic-bezier(0.23, 1, 0.32, 1) .98s forwards;
      }

      @keyframes charIn {
        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }

      @keyframes kickerIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loadLine {
        to {
          transform: translateX(0);
        }
      }

      @keyframes bracketSpinL {
        from {
          transform: translate(-50%, -50%) rotate(0);
        }
        to {
          transform: translate(-50%, -50%) rotate(720deg);
        }
      }

      @keyframes bracketSpinR {
        from {
          transform: translate(50%, -50%) rotate(0);
        }
        to {
          transform: translate(50%, -50%) rotate(720deg);
        }
      }

      @keyframes ringOutL {
        from {
          left: 50%;
          transform: translate(-50%, -50%) rotate(720deg);
        }
        to {
          left: -.2em;
          transform: translate(-100%, -50%) rotate(720deg);
        }
      }

      @keyframes ringOutR {
        from {
          right: 50%;
          transform: translate(50%, -50%) rotate(720deg);
        }
        to {
          right: -.2em;
          transform: translate(100%, -50%) rotate(720deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="welcome-screen" id="welcome-screen" aria-hidden="true">
      <div class="welcome-mark">
        <span class="welcome-kicker">Portfolio</span>
        <span class="welcome-word-frame">
          <span class="welcome-ring-l" aria-hidden="true">&lt;</span>
          <span class="welcome-word" aria-label="ismo1lov">
            <span class="welcome-char">i</span>
            <span class="welcome-char">s</span>
            <span class="welcome-char">m</span>
            <span class="welcome-char">o</span>
            <span class="welcome-char">1</span>
            <span class="welcome-char">l</span>
            <span class="welcome-char">o</span>
            <span class="welcome-char">v</span>
          </span>
          <span class="welcome-ring-r" aria-hidden="true">&gt;</span>
        </span>
        <span class="welcome-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
