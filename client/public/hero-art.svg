<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d120d"/>
      <stop offset="0.55" stop-color="#141a13"/>
      <stop offset="1" stop-color="#0b0f0c"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMid" cx="0.45" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#8cae16" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8cae16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#f2f0e9" stroke-opacity="0.045">
    <path d="M0 120H1920 M0 240H1920 M0 360H1920 M0 480H1920 M0 600H1920 M0 720H1920 M0 840H1920 M0 960H1920"/>
    <path d="M120 0V1080 M240 0V1080 M360 0V1080 M480 0V1080 M600 0V1080 M720 0V1080 M840 0V1080 M960 0V1080 M1080 0V1080 M1200 0V1080 M1320 0V1080 M1440 0V1080 M1560 0V1080 M1680 0V1080 M1800 0V1080"/>
  </g>

  <!-- glow zones -->
  <rect width="1920" height="1080" fill="url(#glowTop)"/>
  <rect width="1920" height="1080" fill="url(#glowMid)"/>

  <!-- soft blobs -->
  <g filter="url(#soft)">
    <circle cx="1450" cy="260" r="300" fill="url(#blob)"/>
    <circle cx="520" cy="820" r="340" fill="url(#blob)"/>
    <circle cx="1180" cy="760" r="260" fill="url(#blob)"/>
  </g>

  <!-- thin rings -->
  <g fill="none" stroke="#b8f230" stroke-opacity="0.14" stroke-width="1.5">
    <circle cx="1380" cy="360" r="130"/>
    <circle cx="1380" cy="360" r="196"/>
    <circle cx="640" cy="520" r="90"/>
  </g>

  <!-- network lines -->
  <g stroke="#b8f230" stroke-width="1.4">
    <path d="M1140 330 L1260 300 L1420 360 L1560 300" stroke-opacity="0.5"/>
    <path d="M1260 300 L1320 480 L1490 560 L1660 540" stroke-opacity="0.22"/>
    <path d="M1490 560 L1600 700" stroke-opacity="0.18"/>
    <path d="M1320 480 L1180 520 L1000 460 L840 540" stroke-opacity="0.3"/>
    <path d="M400 700 L580 640 L760 700 L920 640" stroke-opacity="0.24"/>
    <path d="M580 640 L620 430" stroke-opacity="0.18"/>
    <path d="M680 920 L860 840 L1040 900 L1220 820" stroke-opacity="0.2"/>
    <path d="M1800 160 L1680 260" stroke-opacity="0.2"/>
  </g>

  <!-- network nodes -->
  <g fill="#b8f230">
    <circle cx="1140" cy="330" r="5" opacity="0.9"/>
    <circle cx="1260" cy="300" r="8"/>
    <circle cx="1420" cy="360" r="5" opacity="0.8"/>
    <circle cx="1560" cy="300" r="4" opacity="0.7"/>
    <circle cx="1320" cy="480" r="7"/>
    <circle cx="1490" cy="560" r="6"/>
    <circle cx="1660" cy="540" r="4" opacity="0.7"/>
    <circle cx="1600" cy="700" r="4" opacity="0.6"/>
    <circle cx="1180" cy="520" r="4" opacity="0.6"/>
    <circle cx="1000" cy="460" r="6"/>
    <circle cx="840" cy="540" r="4" opacity="0.6"/>
    <circle cx="400" cy="700" r="5" opacity="0.7"/>
    <circle cx="580" cy="640" r="7"/>
    <circle cx="760" cy="700" r="4" opacity="0.6"/>
    <circle cx="920" cy="640" r="5" opacity="0.7"/>
    <circle cx="620" cy="430" r="4" opacity="0.6"/>
    <circle cx="680" cy="920" r="5" opacity="0.6"/>
    <circle cx="860" cy="840" r="6"/>
    <circle cx="1040" cy="900" r="4" opacity="0.6"/>
    <circle cx="1220" cy="820" r="5" opacity="0.7"/>
    <circle cx="1800" cy="160" r="4" opacity="0.8"/>
    <circle cx="1680" cy="260" r="6" opacity="0.9"/>
  </g>

  <!-- accent nodes with glow -->
  <g>
    <circle cx="1260" cy="300" r="16" fill="#b8f230" opacity="0.14"/>
    <circle cx="1180" cy="520" r="14" fill="#b8f230" opacity="0.12"/>
    <circle cx="620" cy="430" r="12" fill="#8cae16" opacity="0.16"/>
  </g>

  <!-- code brackets watermark -->
  <text x="1876" y="1016" text-anchor="end" font-family="'DM Mono', monospace" font-size="190" font-weight="500" fill="#f2f0e9" fill-opacity="0.05" letter-spacing="18">&gt;_</text>

  <!-- decorative brackets -->
  <text x="150" y="180" font-family="'DM Mono', monospace" font-size="46" fill="#8cae16" fill-opacity="0.85">&lt;/&gt;</text>
  <text x="1760" y="180" text-anchor="end" font-family="'DM Mono', monospace" font-size="46" fill="#b8f230" fill-opacity="0.5">&lt;/&gt;</text>
</svg>