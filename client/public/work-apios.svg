<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1310"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- network line to endpoint -->
  <path d="M300 820 L470 700 L640 760" fill="none" stroke="url(#wire)" stroke-width="2"/>
  <path d="M640 760 L850 700" stroke="#8cae16" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="640,752 648,760 640,768 632,760" fill="#8cae16"/>

  <g filter="url(#shadow)">
    <!-- terminal window -->
    <rect x="280" y="160" width="1040" height="600" rx="22" fill="#171d17" stroke="#2a322a" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="280" y="160" width="1040" height="58" rx="22" fill="#1e251e"/>
    <rect x="280" y="196" width="1040" height="22" fill="#1e251e"/>
    <circle cx="322" cy="189" r="9" fill="#ff5f57"/>
    <circle cx="356" cy="189" r="9" fill="#febc2e"/>
    <circle cx="390" cy="189" r="9" fill="#28c840"/>
    <text x="800" y="194" text-anchor="middle" font-family="'DM Mono', monospace" font-size="16" fill="#7c867c" letter-spacing="2">api_core — node</text>

    <!-- code lines -->
    <g>
      <circle cx="330" cy="270" r="4" fill="#b8f230"/>
      <rect x="360" y="262" width="250" height="16" rx="8" fill="#3a4438" opacity="0.5"/>
      <rect x="360" y="262" width="70" height="16" rx="8" fill="#b8f230" opacity="0.9"/>

      <circle cx="330" cy="326" r="4" fill="#7c867c" opacity="0.7"/>
      <rect x="360" y="318" width="180" height="16" rx="8" fill="#3a4438" opacity="0.35"/>
      <rect x="360" y="318" width="50" height="16" rx="8" fill="#8cae16" opacity="0.8"/>

      <circle cx="330" cy="382" r="4" fill="#7c867c" opacity="0.7"/>
      <rect x="360" y="374" width="230" height="16" rx="8" fill="#3a4438" opacity="0.4"/>

      <circle cx="330" cy="438" r="4" fill="#7c867c" opacity="0.7"/>
      <rect x="360" y="430" width="310" height="16" rx="8" fill="#3a4438" opacity="0.5"/>
      <rect x="360" y="430" width="90" height="16" rx="8" fill="#b8f230" opacity="0.55"/>

      <circle cx="330" cy="494" r="4" fill="#28c840"/>
      <rect x="360" y="486" width="160" height="16" rx="8" fill="#3a4438" opacity="0.5"/>
      <rect x="360" y="486" width="140" height="16" rx="8" fill="#b8f230" opacity="0.9"/>

      <circle cx="330" cy="550" r="4" fill="#7c867c" opacity="0.7"/>
      <rect x="360" y="542" width="200" height="16" rx="8" fill="#3a4438" opacity="0.35"/>

      <circle cx="330" cy="606" r="4" fill="#7c867c" opacity="0.7"/>
      <rect x="360" y="598" width="280" height="16" rx="8" fill="#3a4438" opacity="0.5"/>
      <rect x="360" y="598" width="60" height="16" rx="8" fill="#8cae16" opacity="0.8"/>
    </g>

    <!-- JSON blocks -->
    <g>
      <rect x="920" y="250" width="330" height="140" rx="14" fill="#141a14" stroke="#262e26"/>
      <rect x="944" y="276" width="110" height="12" rx="6" fill="#8cae16" opacity="0.8"/>
      <rect x="944" y="308" width="200" height="12" rx="6" fill="#3a4438" opacity="0.45"/>
      <rect x="944" y="340" width="160" height="12" rx="6" fill="#3a4438" opacity="0.35"/>
      <rect x="944" y="364" width="90" height="12" rx="6" fill="#28c840" opacity="0.8"/>

      <rect x="920" y="422" width="330" height="140" rx="14" fill="#141a14" stroke="#262e26"/>
      <rect x="944" y="448" width="130" height="12" rx="6" fill="#b8f230" opacity="0.85"/>
      <rect x="944" y="480" width="180" height="12" rx="6" fill="#3a4438" opacity="0.45"/>
      <rect x="944" y="512" width="140" height="12" rx="6" fill="#3a4438" opacity="0.35"/>
      <rect x="944" y="536" width="210" height="12" rx="6" fill="#3a4438" opacity="0.5"/>

      <rect x="920" y="594" width="200" height="120" rx="14" fill="#141a14" stroke="#262e26"/>
      <rect x="944" y="620" width="120" height="12" rx="6" fill="#8cae16" opacity="0.7"/>
      <rect x="944" y="652" width="150" height="12" rx="6" fill="#3a4438" opacity="0.45"/>
      <rect x="944" y="684" width="100" height="12" rx="6" fill="#28c840" opacity="0.8"/>
    </g>

    <!-- status bar -->
    <rect x="280" y="760" width="1040" height="0.5" fill="#2a322a"/>
    <circle cx="320" cy="792" r="7" fill="#28c840"/>
    <text x="340" y="797" font-family="'DM Mono', monospace" font-size="15" fill="#7c867c" letter-spacing="2">connected · 12ms</text>
    <rect x="1120" y="786" width="150" height="14" rx="7" fill="#b8f230" opacity="0.9"/>
  </g>

  <!-- endpoint nodes -->
  <g>
    <circle cx="300" cy="820" r="14" fill="#171d17" stroke="#b8f230" stroke-width="3"/>
    <circle cx="300" cy="820" r="5" fill="#b8f230"/>
    <circle cx="640" cy="760" r="14" fill="#171d17" stroke="#8cae16" stroke-width="3"/>
    <circle cx="640" cy="760" r="5" fill="#8cae16"/>
    <circle cx="850" cy="700" r="14" fill="#171d17" stroke="#b8f230" stroke-width="3"/>
    <circle cx="850" cy="700" r="5" fill="#b8f230"/>
  </g>

  <!-- floating tag -->
  <g transform="rotate(3 1280 868)">
    <rect x="1180" y="840" width="200" height="46" rx="12" fill="#1d241d" stroke="#8cae16" stroke-opacity="0.5"/>
    <circle cx="1208" cy="863" r="7" fill="#8cae16"/>
    <text x="1230" y="868" font-family="'DM Mono', monospace" font-size="15" fill="#f2f0e9" letter-spacing="2">APIs / scale</text>
  </g>
</svg>