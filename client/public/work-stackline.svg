    <g>
      <rect x="540" y="308" width="250" height="120" rx="14" fill="#1d241d" stroke="#262e26"/>
      <rect x="566" y="334" width="120" height="10" rx="5" fill="#3a4438" opacity="0.4"/>
      <rect x="566" y="360" width="160" height="20" rx="6" fill="#f2f0e9" opacity="0.82"/>
      <rect x="566" y="396" width="70" height="10" rx="5" fill="#8cae16" opacity="0.7"/>

      <rect x="810" y="308" width="250" height="120" rx="14" fill="#1d241d" stroke="#262e26"/>
      <rect x="836" y="334" width="120" height="10" rx="5" fill="#3a4438" opacity="0.4"/>
