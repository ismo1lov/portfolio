  <!-- floating tag -->
  <g transform="rotate(-4 1420 220)">
    <rect x="1320" y="150" width="200" height="46" rx="12" fill="#1d241d" stroke="#8cae16" stroke-opacity="0.5"/>
    <circle cx="1348" cy="173" r="7" fill="#b8f230"/>
    <text x="1370" y="178" font-family="'DM Mono', monospace" font-size="15" fill="#f2f0e9" letter-spacing="2">in motion</text>
  </g>
