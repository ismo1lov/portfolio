<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121712"/>
      <stop offset="1" stop-color="#0c100c"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#b8f230" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#b8f230" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- window -->
    <rect x="200" y="150" width="1200" height="700" rx="22" fill="#181e18" stroke="#2a322a" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="200" y="150" width="1200" height="64" rx="22" fill="#1d241d"/>
    <rect x="200" y="192" width="1200" height="22" fill="#1d241d"/>
    <circle cx="246" cy="182" r="9" fill="#ff5f57"/>
    <circle cx="280" cy="182" r="9" fill="#febc2e"/>
    <circle cx="314" cy="182" r="9" fill="#28c840"/>
    <text x="800" y="188" text-anchor="middle" font-family="'DM Mono', monospace" font-size="16" fill="#7c867c" letter-spacing="2">stackline / dashboard</text>

    <!-- sidebar -->
    <rect x="200" y="214" width="280" height="636" fill="#141a14"/>
    <g>
      <rect x="224" y="254" width="232" height="16" rx="8" fill="#3a4438" opacity="0.35"/>
      <rect x="224" y="254" width="60" height="16" rx="8" fill="#b8f230" opacity="0.85"/>
      <rect x="224" y="306" width="232" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="358" width="232" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="410" width="232" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="462" width="160" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="514" width="200" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="566" width="120" height="16" rx="8" fill="#3a4438" opacity="0.25"/>
      <rect x="224" y="700" width="210" height="120" rx="14" fill="#1d241d" stroke="#262e26" stroke-width="1"/>
      <rect x="248" y="730" width="150" height="10" rx="5" fill="#3a4438" opacity="0.4"/>
      <rect x="248" y="758" width="100" height="10" rx="5" fill="#3a4438" opacity="0.3"/>
      <circle cx="248" cy="792" r="22" fill="#b8f230" opacity="0.9"/>
