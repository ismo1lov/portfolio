    <rect x="566" y="478" width="140" height="10" rx="5" fill="#3a4438" opacity="0.4"/>
    <g stroke="#262e26" stroke-opacity="0.6">
      <path d="M566 620H1040"/>
      <path d="M566 680H1040"/>
      <path d="M566 560H1040"/>
    </g>
    <path d="M566 640 L630 600 L690 620 L750 560 L810 580 L870 520 L920 540 L970 490 L1040 500 L1040 680 L566 680 Z" fill="url(#chartArea)"/>
    <path d="M566 640 L630 600 L690 620 L750 560 L810 580 L870 520 L920 540 L970 490 L1040 500" fill="none" stroke="#b8f230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="970" cy="490" r="8" fill="#b8f230"/>
    <circle cx="970" cy="490" r="18" fill="#b8f230" opacity="0.18"/>

    <!-- side mini data -->
    <rect x="1080" y="452" width="250" height="272" rx="14" fill="#1d241d" stroke="#262e26"/>
    <rect x="1106" y="478" width="130" height="10" rx="5" fill="#3a4438" opacity="0.4"/>
    <g>
      <rect x="1106" y="520" width="126" height="18" rx="4" fill="#b8f230" opacity="0.85"/>
      <rect x="1106" y="560" width="92" height="18" rx="4" fill="#3a4438" opacity="0.4"/>
      <rect x="1106" y="600" width="140" height="18" rx="4" fill="#3a4438" opacity="0.35"/>
      <rect x="1106" y="640" width="104" height="18" rx="4" fill="#3a4438" opacity="0.4"/>
